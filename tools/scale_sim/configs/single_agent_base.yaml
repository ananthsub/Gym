# Single-agent — base template for the single-agent sweep matrix.
#
# Topology: 1 head + 1 model + 1 resources + 1 simple_agent. Sub-sweeps
# 01_concurrency_baseline / 02_output_tokens_far_tail / 03_n_hops_curve /
# 04_defect_5_ablation all override individual scale_sim.* knobs on top of
# this file. Defaults below are picked so that, with no overrides, the cell
# matches the §5.1 reference point: 8 K concurrent /run requests, 1 hop,
# 16 KB tool/4 KB verify bodies, 1 K output tokens.
#
# Run from `tools/scale_sim/`:
#
#   python data/generate_data.py --n 10000 --user-input-size-bytes 1024 \
#       --output data/single_agent_10k.jsonl
#   ng_run "+config_paths=[configs/single_agent_base.yaml]"
#   # ... wait for "All N / N servers ready!" ...
#   python load_driver.py --config configs/single_agent_base.yaml \
#       --input-jsonl data/single_agent_10k.jsonl
#
# For the multi-agent (N agents + N resources + 1 shared model) sweep, see
# configs/multi_agent_base.yaml.

head_server:
  host: 0.0.0.0
  port: 5000

# Larger global aiohttp pool to actually allow 8K concurrent connections per host.
global_aiohttp_connector_limit: 102400
global_aiohttp_connector_limit_per_host: 16384

synthetic_resources_inst:
  resources_servers:
    synthetic_resources:
      entrypoint: app.py
      domain: other
      verified: false
      tool:
        async_latency_ms: 100
        cpu_burn_ms: 0
        body_size_bytes: 16384
        body_shape: flat_padding
      verify:
        async_latency_ms: 50
        cpu_burn_ms: 0
        body_size_bytes: 4096
        body_shape: flat_padding
      port: 5001

synthetic_model_inst:
  responses_api_models:
    synthetic_model:
      entrypoint: app.py
      async_latency_ms: 200
      cpu_burn_ms: 0
      # 512 prompt tokens + 1024 output tokens, RL training mode → ~30 KB body.
      # Sweep these (especially output_tokens) to push the body-size axis.
      prompt_tokens: 512
      output_tokens: 1024
      include_token_ids_and_log_probs: true
      n_reasoning_items: 0
      reasoning_tokens_per_item: 0
      tool_name: synthetic_tool
      port: 5002

synthetic_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: synthetic_resources_inst
      model_server:
        type: responses_api_models
        name: synthetic_model_inst
      datasets:
        - name: single_agent
          type: example
          jsonl_fpath: data/single_agent_10k.jsonl
          num_repeats: 1
      port: 5003

scale_sim:
  agent_name: synthetic_simple_agent
  concurrency: 8192
  total_requests: 10000
  early_stop_failure_rate: 0.10
  early_stop_retry_rate: 0.30
  # Lowered from 600 s to 300 s. The wall-clock-bound sub-sweep cells
  # (n_hops=16+, output_tokens=512K+, concurrency=16K) saturate the consumer
  # event loop well within 300 s — the additional 300 s of the old budget
  # only collected redundant percentile data on the same plateau. Cuts total
  # single-agent matrix wall-clock by ~25% with no loss in characterization
  # of the M3 cliff shape.
  early_stop_wall_clock_s: 300
  early_stop_window_s: 30
