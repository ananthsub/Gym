# Tiny smoke test: 16 concurrent requests, 1 hop, 1 KB bodies. Should complete in <30s on
# any host. Use this to validate the harness end-to-end before running real sweeps.
#
# Run from `tools/scale_sim/`:
#
#   python data/generate_data.py --n 256 --user-input-size-bytes 256 --output data/smoke.jsonl
#   ng_run "+config_paths=[configs/smoke.yaml]"
#   # ... wait for "All N / N servers ready!" ...
#   python load_driver.py --config configs/smoke.yaml --input-jsonl data/smoke.jsonl

# Head server on a port below the ephemeral floor (9000 on OCI-HSG, 32768 on stock Linux).
# 5000-5999 is the range reserved for NeMo Gym HTTP servers per ray.sub.
head_server:
  host: 0.0.0.0
  port: 5000

synthetic_resources_inst:
  resources_servers:
    synthetic_resources:
      entrypoint: app.py
      domain: other
      verified: false
      tool:
        async_latency_ms: 5
        cpu_burn_ms: 0
        body_size_bytes: 1024
        body_shape: flat_padding
      verify:
        async_latency_ms: 5
        cpu_burn_ms: 0
        body_size_bytes: 512
        body_shape: flat_padding
      inject_500_rate: 0.0
      inject_hang_rate: 0.0
      port: 5001

synthetic_model_inst:
  responses_api_models:
    synthetic_model:
      entrypoint: app.py
      async_latency_ms: 10
      cpu_burn_ms: 0
      # Tiny sequence lengths for smoke. ~5 KB body.
      prompt_tokens: 64
      output_tokens: 32
      include_token_ids_and_log_probs: true
      n_reasoning_items: 0
      reasoning_tokens_per_item: 0
      tool_name: synthetic_tool
      port: 5002

synthetic_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: synthetic_resources_inst
      model_server:
        type: responses_api_models
        name: synthetic_model_inst
      datasets:
        - name: smoke
          type: example
          jsonl_fpath: data/smoke.jsonl
          num_repeats: 1
      port: 5003

# Knobs read by tools/scale_sim/load_driver.py (not a server).
scale_sim:
  agent_name: synthetic_simple_agent
  concurrency: 16
  total_requests: 256
  early_stop_failure_rate: 0.5
  early_stop_wall_clock_s: 120
  early_stop_window_s: 30
