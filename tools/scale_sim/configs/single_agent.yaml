# Single-agent topology: 1 head + 1 model + 1 resources + 1 agent.
#
# Defaults below drive 8192 concurrent /run requests, 1 hop, 16 KB tool / 4 KB
# verify bodies, 1 K output tokens. Override scale_sim.concurrency (and the
# synthetic_model / synthetic_resources knobs) to sweep an axis.
#
# Run from `tools/scale_sim/`:
#
#   python data/generate_data.py --n 10000 --user-input-size-bytes 1024 \
#       --output data/single_agent_10k.jsonl
#   ng_run "+config_paths=[configs/single_agent.yaml]"
#   # ... wait for "All N / N servers ready!" ...
#   python load_driver.py --config configs/single_agent.yaml \
#       --input-jsonl data/single_agent_10k.jsonl
#
# For the N-agent topology, see configs/multi_agent.yaml + gen_multi_agent.py.

head_server:
  host: 0.0.0.0
  port: 5000

# Larger global aiohttp pool to actually allow 8K concurrent connections per host.
global_aiohttp_connector_limit: 102400
global_aiohttp_connector_limit_per_host: 16384

synthetic_resources_inst:
  resources_servers:
    synthetic_resources:
      entrypoint: app.py
      domain: other
      verified: false
      tool:
        async_latency_ms: 100
        cpu_burn_ms: 0
        body_size_bytes: 16384
        body_shape: flat_padding
      verify:
        async_latency_ms: 50
        cpu_burn_ms: 0
        body_size_bytes: 4096
        body_shape: flat_padding
      port: 5001

synthetic_model_inst:
  responses_api_models:
    synthetic_model:
      entrypoint: app.py
      async_latency_ms: 200
      cpu_burn_ms: 0
      # 512 prompt tokens + 1024 output tokens, RL training mode → ~30 KB body.
      # Sweep these (especially output_tokens) to push the body-size axis.
      prompt_tokens: 512
      output_tokens: 1024
      include_token_ids_and_log_probs: true
      n_reasoning_items: 0
      reasoning_tokens_per_item: 0
      tool_name: synthetic_tool
      port: 5002

synthetic_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: synthetic_resources_inst
      model_server:
        type: responses_api_models
        name: synthetic_model_inst
      datasets:
        - name: single_agent
          type: example
          jsonl_fpath: data/single_agent_10k.jsonl
          num_repeats: 1
      port: 5003

scale_sim:
  agent_name: synthetic_simple_agent
  concurrency: 8192
  total_requests: 10000
  early_stop_failure_rate: 0.10
  early_stop_retry_rate: 0.30
  # Stop a cell after this many seconds. Saturated cells reach a steady tail
  # well within 300 s; more time only collects redundant percentile data.
  early_stop_wall_clock_s: 300
  early_stop_window_s: 30
