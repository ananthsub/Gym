# Multi-agent base template (not runnable on its own).
#
# It carries the per-server knobs and the `scale_sim:` block that do not depend
# on N, plus a top-level `multi_agent:` block of metadata the generator reads.
# configs/gen_multi_agent.py takes this file + --n-agents N and stamps out N
# agent instances + N resources instances + 1 shared model into a runnable
# config, which is what gets passed to ng_run.
#
# Knobs mirror configs/single_agent.yaml so multi-agent results are directly
# comparable to the single-agent runs.
#
# Topology: 1 head + 1 shared model + N resources + N agents
# (2N + 2 server processes total).

head_server:
  host: 0.0.0.0
  port: 5000

# Big aiohttp connector pool — one consumer event loop fanning out to N servers
# at a few thousand in-flight needs more than the default 100-per-host cap.
global_aiohttp_connector_limit: 102400
global_aiohttp_connector_limit_per_host: 16384

# Skip `uv venv --seed && uv sync` if the per-server-type .venv is already on
# disk. Critical at high N: at N>=32 the N instances of synthetic_resources
# (and N of simple_agent) share the same dir_path and race against the same
# .venv. Concurrent `uv venv --seed` against one venv can leave its
# `pip-*.dist-info/RECORD` partially uninstalled, which breaks every
# subsequent cell that uses that server type ("Cannot uninstall package").
# Pre-warm the venvs once via a low-N cell, then this knob makes high-N
# cells skip the racy setup entirely.
skip_venv_if_present: true

# ---------- Per-server knob template ----------
# The generator reads these blocks and stamps them into the N replicated
# resources / agent / 1 model instances. Edit here, not in the generated YAML.

multi_agent:
  # Shared synthetic_model knobs. Same as single_agent.yaml.
  model:
    async_latency_ms: 200
    cpu_burn_ms: 0
    prompt_tokens: 512
    output_tokens: 1024
    chars_per_token: 4
    include_token_ids_and_log_probs: true
    n_reasoning_items: 0
    reasoning_tokens_per_item: 0
    tool_name: synthetic_tool

  # Per-instance synthetic_resources knobs (same shape, replicated N times).
  resources:
    tool:
      async_latency_ms: 100
      cpu_burn_ms: 0
      body_size_bytes: 16384
      body_shape: flat_padding
    verify:
      async_latency_ms: 50
      cpu_burn_ms: 0
      body_size_bytes: 4096
      body_shape: flat_padding
    inject_500_rate: 0.0
    inject_hang_rate: 0.0

  # Per-instance simple_agent knobs.
  agent:
    max_steps: 1
    domain: other

  # Port allocation: head=5000, model=5001, resources_i=5002+i, agent_i=5002+N+i.
  # Generator owns the math; this is only documented for reference.
  port_base: 5001

  # Dataset metadata that goes into each generated agent instance. The driver
  # reads its own JSONL directly — these fields are only here to satisfy
  # ng_run's lifecycle plumbing.
  dataset_name: multi_agent
  dataset_jsonl_fpath: data/multi_agent_10k.jsonl

# ---------- Load driver knobs ----------
#
# The generator emits `agent_names: [synthetic_simple_agent_0, ..., _{N-1}]` here
# at generation time. The values below are defaults; override `concurrency` and
# `total_requests` per cell via gen_multi_agent.py flags.

scale_sim:
  concurrency: 4096
  total_requests: 10000
  semaphore_enabled: true
  early_stop_failure_rate: 0.10
  early_stop_retry_rate: 0.30
  early_stop_wall_clock_s: 1800
  early_stop_window_s: 30
