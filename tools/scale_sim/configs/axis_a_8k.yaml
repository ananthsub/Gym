# Axis A — concurrent fan-in. One cell of the §5.1 sweep matrix.
# 8 K concurrent /run requests, 1 hop, 16 KB bodies.
#
# Run from `tools/scale_sim/`:
#
#   python data/generate_data.py --n 10000 --user-input-size-bytes 1024 --output data/axis_a_10k.jsonl
#   ng_run "+config_paths=[configs/axis_a_8k.yaml]"
#   # ... wait for "All N / N servers ready!" ...
#   python load_driver.py --config configs/axis_a_8k.yaml --input-jsonl data/axis_a_10k.jsonl

head_server:
  host: 0.0.0.0
  port: 5000

# Larger global aiohttp pool to actually allow 8K concurrent connections per host.
global_aiohttp_connector_limit: 102400
global_aiohttp_connector_limit_per_host: 16384

synthetic_resources_inst:
  resources_servers:
    synthetic_resources:
      entrypoint: app.py
      domain: other
      verified: false
      tool:
        async_latency_ms: 100
        cpu_burn_ms: 0
        body_size_bytes: 16384
        body_shape: flat_padding
      verify:
        async_latency_ms: 50
        cpu_burn_ms: 0
        body_size_bytes: 4096
        body_shape: flat_padding
      port: 5001

synthetic_model_inst:
  responses_api_models:
    synthetic_model:
      entrypoint: app.py
      async_latency_ms: 200
      cpu_burn_ms: 0
      # 512 prompt tokens + 1024 output tokens, RL training mode → ~30 KB body.
      # Sweep these (especially output_tokens) to push the body-size axis.
      prompt_tokens: 512
      output_tokens: 1024
      include_token_ids_and_log_probs: true
      n_reasoning_items: 0
      reasoning_tokens_per_item: 0
      tool_name: synthetic_tool
      port: 5002

synthetic_simple_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 1
      resources_server:
        type: resources_servers
        name: synthetic_resources_inst
      model_server:
        type: responses_api_models
        name: synthetic_model_inst
      datasets:
        - name: axis_a
          type: example
          jsonl_fpath: data/axis_a_10k.jsonl
          num_repeats: 1
      port: 5003

scale_sim:
  agent_name: synthetic_simple_agent
  concurrency: 8192
  total_requests: 10000
  early_stop_failure_rate: 0.10
  early_stop_retry_rate: 0.30
  early_stop_wall_clock_s: 600
  early_stop_window_s: 30
