head_server:
  host: 0.0.0.0
  port: 5000
global_aiohttp_connector_limit: 102400
global_aiohttp_connector_limit_per_host: 16384
skip_venv_if_present: true
scale_sim:
  concurrency: 1024
  total_requests: 20000
  semaphore_enabled: true
  early_stop_failure_rate: 1.0
  early_stop_retry_rate: 1.0
  early_stop_wall_clock_s: 240
  early_stop_window_s: 30
  agent_names:
  - synthetic_simple_agent_0
  - synthetic_simple_agent_1
  - synthetic_simple_agent_2
  - synthetic_simple_agent_3
shared_synthetic_model:
  responses_api_models:
    synthetic_model:
      entrypoint: app.py
      async_latency_ms: 200
      cpu_burn_ms: 0
      prompt_tokens: 512
      output_tokens: 65536
      chars_per_token: 4
      include_token_ids_and_log_probs: true
      n_reasoning_items: 0
      reasoning_tokens_per_item: 0
      tool_name: synthetic_tool
      port: 5001
synthetic_resources_0:
  resources_servers:
    synthetic_resources:
      entrypoint: app.py
      domain: other
      verified: false
      tool:
        async_latency_ms: 100
        cpu_burn_ms: 0
        body_size_bytes: 16384
        body_shape: flat_padding
      verify:
        async_latency_ms: 50
        cpu_burn_ms: 0
        body_size_bytes: 4096
        body_shape: flat_padding
      inject_500_rate: 0.0
      inject_hang_rate: 0.0
      port: 5002
