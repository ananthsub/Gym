      cpu_burn_ms: 0
      prompt_tokens: 512
      output_tokens: 65536
      chars_per_token: 4
      include_token_ids_and_log_probs: true
      n_reasoning_items: 0
      reasoning_tokens_per_item: 0
      tool_name: synthetic_tool
      port: 5001
