head_server:
  host: 0.0.0.0
  port: 5000
global_aiohttp_connector_limit: 102400
global_aiohttp_connector_limit_per_host: 16384
skip_venv_if_present: true
scale_sim:
  concurrency: 4096
  total_requests: 20000
  semaphore_enabled: true
  early_stop_failure_rate: 1.0
  early_stop_retry_rate: 1.0
  early_stop_wall_clock_s: 240
  early_stop_window_s: 30
  agent_names:
  - synthetic_simple_agent_0
  - synthetic_simple_agent_1
  - synthetic_simple_agent_2
  - synthetic_simple_agent_3
  - synthetic_simple_agent_4
  - synthetic_simple_agent_5
